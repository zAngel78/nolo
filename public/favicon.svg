<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#1e293b" rx="20"/>
  
  <!-- Lock Icon -->
  <g transform="translate(50, 50)">
    <!-- Lock Body -->
    <rect x="-15" y="0" width="30" height="25" rx="3" fill="#ffffff"/>
    
    <!-- Lock Shackle -->
    <path d="M -10,-15 Q -10,-25 0,-25 Q 10,-25 10,-15" 
          stroke="#ffffff" 
          stroke-width="4" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="10" r="3" fill="#1e293b"/>
    <rect x="-1.5" y="10" width="3" height="8" fill="#1e293b" rx="1"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="75" cy="25" r="6" fill="#3b82f6"/>
</svg>
